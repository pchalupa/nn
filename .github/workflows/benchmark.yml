name: Benchmark
on:
  push:
    branches: [main]
  pull_request:
jobs:
  benchmark:
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      - uses: CodSpeedHQ/action@v5
        env:
          NODE_OPTIONS: --disable-wasm-trap-handler
        with:
          mode: simulation,memory
          run: pnpm bench
