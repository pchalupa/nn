name: Code Quality
on: push
jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm clutter:check
      - run: pnpm ts:check
      - run: pnpm test
      - run: pnpm --filter example-react exec playwright install --with-deps chromium
      - run: pnpm --filter example-react test:e2e
