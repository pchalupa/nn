name: Pull Request
on: pull_request
jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm clutter:check
      - run: pnpm ts:check
      - run: pnpm test
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@v2
        with:
          comment: false
          project: "@nn/react-devtools,@nn/react,example-react"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter example-react test:e2e
